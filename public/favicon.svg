<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="nexoGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="nexoGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="nexoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Premium Container -->
  <rect width="512" height="512" rx="128" fill="#0B0F17" />
  
  <!-- Outer Subtle Ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="url(#nexoGrad1)" stroke-width="4" stroke-opacity="0.25" fill="none" />

  <!-- Futuristic Capital N with Integrated Rising Arrow -->
  <g filter="url(#nexoGlow)">
    <!-- Left Stem -->
    <path d="M 128 120 L 192 120 L 192 392 L 128 392 Z" fill="url(#nexoGrad1)" />
    
    <!-- Sharp Diagonal Ribbon -->
    <path d="M 192 120 L 320 320 L 320 392 L 192 192 Z" fill="url(#nexoGrad2)" opacity="0.95" />
    
    <!-- Right Stem -->
    <path d="M 320 120 L 384 120 L 384 392 L 320 392 Z" fill="url(#nexoGrad1)" />
    
    <!-- Upward Trend Accent Diamond at top right -->
    <polygon points="384,120 420,84 384,48 348,84" fill="#38BDF8" />
  </g>
</svg>
